    <script>

let movies = [
    "Harry Potter and the Philosopher's Stone",
    "The Hunger Games",
    "The Lord of the Rings",
    "Dune",
    "The Martian",
    "Inception",
    "Interstellar",
    "The Dark Knight"
];

let movieImages = [
    "https://image.tmdb.org/t/p/w342/wuMc08IPKEatf9rnMNXvIDxqP4W.jpg",
    "https://upload.wikimedia.org/wikipedia/en/4/42/HungerGamesPoster.jpg",
    "https://upload.wikimedia.org/wikipedia/en/f/fb/Lord_Rings_Fellowship_Ring.jpg",
    "https://upload.wikimedia.org/wikipedia/en/8/8e/Dune_%282021_film%29.jpg",
    "https://upload.wikimedia.org/wikipedia/en/c/cd/The_Martian_film_poster.jpg",
    "https://upload.wikimedia.org/wikipedia/en/2/2e/Inception_%282010%29_theatrical_poster.jpg",
    "https://upload.wikimedia.org/wikipedia/en/b/bc/Interstellar_film_poster.jpg",
    "https://upload.wikimedia.org/wikipedia/en/1/1c/The_Dark_Knight_%282008_film%29.jpg"
];


function suggestMovie() {

    let randomNumber =
        Math.floor(Math.random() * movies.length);

    document.getElementById("movieName").innerText =
        movies[randomNumber];

    document.getElementById("movieImage").src =
        movieImages[randomNumber];

    document.getElementById("moviePopup").style.display =
        "flex";
}


function closePopup() {

    document.getElementById("moviePopup").style.display =
        "none";
}

    </script>
